<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>صوّت | طاولة القرار v-lock2</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; font-family: Cairo, sans-serif;
      background:
        radial-gradient(80% 50% at 80% 0%, rgba(201,165,106,.18), transparent 50%),
        linear-gradient(180deg, #10151e, #07090e);
      color: #fff8ea; padding: 22px 16px 28px;
    }
    .top { text-align: center; margin-bottom: 10px; }
    .crest {
      width: 92px; height: 92px; margin: 0 auto 10px; border-radius: 50%;
      display: grid; place-items: center; background: #fff;
      border: 3px solid #d4a017;
      box-shadow: 0 0 0 5px rgba(15, 44, 89, 0.45), 0 8px 20px rgba(0,0,0,.35);
    }
    .crest img { width: 58px; height: auto; display: block; }
    .brand { color: #c9a56a; letter-spacing: .16em; font-weight: 900; font-size: .78rem; }
    h1 { margin: 8px 0 6px; font-size: 1.15rem; font-weight: 800; }
    .q { font-size: 1.32rem; line-height: 1.65; font-weight: 900; margin: 10px 0 18px; }
    .wait, .ok, .closed { text-align: center; padding: 56px 12px; font-weight: 800; font-size: 1.2rem; animation: rise .45s ease; }
    .wait, .ok { color: #8fd4d8; }
    .closed { color: #ffb4a8; }
    .clock {
      font-size: 3rem; color: #ff6b5a; margin-bottom: 8px; font-weight: 900;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(1.08); text-shadow: 0 0 18px rgba(255,107,90,.45); } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .grid { display: grid; gap: 12px; }
    button.opt {
      display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center;
      min-height: 78px; padding: 14px 16px; border: 0; border-radius: 18px;
      color: #fff; font: inherit; font-weight: 800; text-align: right; cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.28);
      transition: transform .15s ease, filter .15s ease;
    }
    button.opt:active { transform: scale(.97); filter: brightness(1.12); }
    button.opt:disabled { opacity: .7; cursor: default; }
    button.opt b {
      width: 52px; height: 52px; border-radius: 14px; background: rgba(0,0,0,.22);
      display: grid; place-items: center; font-size: 1.35rem;
    }
    .meta { color: #c9b89a; font-size: .85rem; margin-top: 16px; text-align: center; }
    .focus-bar {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
      margin: 8px 0 4px;
    }
    .focus-bar button {
      border: 1px solid rgba(201,165,106,.45); background: rgba(201,165,106,.12);
      color: #ffe7a8; font: inherit; font-weight: 800; font-size: .82rem;
      padding: 8px 12px; border-radius: 999px; cursor: pointer;
    }
    .guard {
      position: fixed; inset: 0; z-index: 50; display: none; place-items: center;
      background: rgba(4,6,10,.96); padding: 24px; text-align: center;
    }
    .guard.on { display: grid; }
    .guard strong { font-size: 1.35rem; color: #ffb4a8; display: block; margin-bottom: 10px; }
    .guard p { color: #fff8ea; font-weight: 800; line-height: 1.7; margin: 0 0 14px; }
    .guard input {
      width: min(260px, 90%); padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(201,165,106,.45);
      background: #121722; color: #fff8ea; font: inherit; font-weight: 800; text-align: center;
      letter-spacing: .2em; margin-bottom: 10px;
    }
    .guard button {
      border: 0; border-radius: 14px; padding: 12px 18px; font: inherit; font-weight: 900;
      background: linear-gradient(135deg, #c9a56a, #e0b34a); color: #1a1208; cursor: pointer;
    }
    .guard .err { color: #ff8f7d; font-weight: 800; min-height: 1.2em; margin: 0 0 8px; }
    .guard .rebuke {
      color: #ffe0a8; font-weight: 900; line-height: 1.8;
      margin: 14px 0 16px; font-size: clamp(1.15rem, 4.5vw, 1.45rem);
      padding: 14px 16px; border-radius: 16px;
      background: rgba(255, 107, 90, 0.16);
      border: 1px solid rgba(255, 180, 168, 0.5);
      box-shadow: 0 0 24px rgba(255, 107, 90, 0.18);
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="crest"><img src="img/sands-logo.png" alt="أكاديمية ساندس الوطنية" /></div>
    <div class="brand">طاولة القرار</div>
    <h1>أكاديمية ساندس الوطنية</h1>
    <div class="focus-bar">
      <button type="button" id="btn-fs">ملء الشاشة</button>
    </div>
    <p class="meta">ابقوا على هذه الصفحة طوال الجلسة. مغادرة الصفحة تقفل التصويت ويحتاج فتحه من المعلمة.</p>
  </div>
  <div id="app"></div>
  <div class="guard" id="guard" aria-live="assertive">
    <div id="guard-box">
      <strong>التصويت مُقفَل</strong>
      <p class="rebuke">الثقة تُمنح… وتُسحب.<br>كوني على قدر الثقة التي أُعطيت لكِ.</p>
      <p>غادرتم شاشة التصويت.<br>نادوا المعلمة لفتح التصويت.</p>
      <p class="err" id="lock-err"></p>
      <input id="lock-pin" type="password" inputmode="numeric" maxlength="8" placeholder="كلمة سر المعلمة" autocomplete="off" />
      <br />
      <button type="button" id="btn-unlock">فتح بواسطة المعلمة</button>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=lock1"></script>
  <script src="js/live.js?v=lock1"></script>
  <script src="js/data.js?v=lock1"></script>
  <script>
    const LETTERS = ["أ", "ب", "ج", "د", "هـ"];
    const COLORS = ["#e21b3c", "#1368ce", "#d89e00", "#26890c", "#864cbf"];
    const app = document.getElementById("app");
    const voter = localStorage.getItem("mng-voter") || (localStorage.setItem("mng-voter", crypto.randomUUID()), localStorage.getItem("mng-voter"));
    let lastId = "";
    let votedFor = "";
    let screen = "";
    let audio;
    let lastData = null;
    let untilMs = 0;

    function beep() {
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === "suspended") audio.resume();
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = "triangle";
        o.frequency.value = 740;
        g.gain.setValueAtTime(0.04, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.09);
        o.connect(g); g.connect(audio.destination);
        o.start(); o.stop(audio.currentTime + 0.09);
      } catch { /* ignore */ }
    }

    function gasUrl() { return (SHOW.vote && SHOW.vote.gasUrl) || localStorage.getItem("vote-gas") || ""; }

    function jsonp(url, params) {
      return new Promise((resolve, reject) => {
        const cb = "kcb" + Math.random().toString(36).slice(2);
        const q = new URLSearchParams({ ...params, callback: cb });
        const s = document.createElement("script");
        const t = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 8000);
        function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
        window[cb] = (data) => { cleanup(); resolve(data); };
        s.onerror = () => { cleanup(); reject(new Error("net")); };
        s.src = url + (url.includes("?") ? "&" : "?") + q;
        document.body.appendChild(s);
      });
    }

    function withClock(data) {
      if (!data || !data.active) return data;
      if (untilMs > Date.now()) {
        const left = Math.max(0, Math.floor((untilMs - Date.now()) / 1000));
        return Object.assign({}, data, { open: left > 0, remaining: left, armed: false });
      }
      return data;
    }

    function isOpen(data) {
      return Boolean(data.active && data.open && Number(data.remaining || 0) > 0);
    }
    function isArmed(data) {
      return Boolean(data.active && (data.armed || data.active.armed) && !isOpen(data));
    }

    function paint(incoming) {
      if (incoming && incoming.until) untilMs = Number(incoming.until);
      else if (incoming && incoming.open && incoming.remaining != null && !incoming.until) {
        untilMs = Date.now() + Number(incoming.remaining) * 1000;
      }
      const data = withClock(incoming || lastData);
      lastData = incoming || lastData;
      if (!data || !data.active) {
        lastId = "";
        votedFor = "";
        untilMs = 0;
        if (screen === "wait") return;
        screen = "wait";
        app.innerHTML = '<div class="wait">انتظروا هنا.<br>السؤال يظهر لوحده عند بدء الجولة.</div><p class="meta">افتحوا الرابط مرة واحدة وابقوا على الصفحة.</p>';
        return;
      }
      if (data.active.id !== lastId) { lastId = data.active.id; votedFor = ""; screen = ""; }
      if (votedFor === data.active.id) {
        if (screen === "ok") return;
        screen = "ok";
        app.innerHTML = '<div class="ok">وُسِم صوتكم.<br>شاهدوا النسب وهي تتحرك على الشاشة.</div>';
        return;
      }
      if (isArmed(data)) {
        const key = "ready:" + data.active.id;
        if (screen === key) return;
        screen = key;
        app.innerHTML = '<p class="q"></p><div class="wait">انتظروا إشارة المضيفة.<br>سيبدأ التصويت بعد قليل.</div>';
        app.querySelector(".q").textContent = data.active.q;
        return;
      }
      if (!isOpen(data)) {
        if (screen === "closed") return;
        screen = "closed";
        app.innerHTML = '<div class="closed">انتهى التصويت.<br>ارفعوا عيونكم إلى الشاشة.</div>';
        return;
      }
      const key = "q:" + data.active.id;
      if (screen !== key) {
        screen = key;
        app.innerHTML = '<div class="clock" data-left></div><p class="q"></p><div class="grid" id="opts"></div>';
        app.querySelector(".q").textContent = data.active.q;
        data.active.options.forEach((label, i) => {
          const b = document.createElement("button");
          b.className = "opt";
          b.style.background = COLORS[i % COLORS.length];
          b.innerHTML = `<b>${LETTERS[i]}</b><span></span>`;
          b.querySelector("span").textContent = label;
          b.onclick = async () => {
            if (votedFor === data.active.id) return;
            beep();
            votedFor = data.active.id;
            paint(lastData);
            try {
              if (Live.ready()) await Live.castVote(data.active.id, label, voter);
              else if (gasUrl()) await jsonp(gasUrl(), { action: "vote", q: data.active.id, choice: label, voter });
              else {
                await fetch("/api/vote", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ q: data.active.id, choice: label, voter }),
                });
              }
            } catch { /* الصوت وُسم محلياً */ }
          };
          document.getElementById("opts").appendChild(b);
        });
      }
      const clock = app.querySelector("[data-left]");
      if (clock) clock.textContent = data.remaining;
    }

    async function boot() {
      app.innerHTML = '<div class="wait">نحاول الاتصال…</div>';
      const live = window.Live ? await Live.init() : false;
      if (live) {
        Live.onPoll(paint);
        setInterval(() => { if (lastData) paint(lastData); }, 250);
        return;
      }
      async function tick() {
        try {
          const gas = gasUrl();
          const data = gas
            ? await jsonp(gas, { action: "state" })
            : await (await fetch("/api/state", { cache: "no-store" })).json();
          paint(data);
        } catch {
          if (screen !== "err") {
            screen = "err";
            app.innerHTML = '<div class="wait">نحاول الاتصال بالعرض…</div>';
          }
        }
      }
      tick();
      setInterval(tick, 700);
    }

    const LOCK_KEY = "mng-vote-locked";
    const GUEST_KEY = "mng-vote-guest";
    const PIN = String((SHOW.vote && SHOW.vote.pin) || "4826");
    const params = new URLSearchParams(location.search);
    // رابط الضيوف فقط: vote.html?guest=1 — لا يظهر خيار على الشاشة حتى لا تلتف الطالبات
    if (params.get("guest") === "1") localStorage.setItem(GUEST_KEY, "1");
    const isGuest = localStorage.getItem(GUEST_KEY) === "1";
    const guard = document.getElementById("guard");
    const lockErr = document.getElementById("lock-err");
    const lockPin = document.getElementById("lock-pin");
    let leaveTimer = null;

    if (isGuest) {
      const tip = document.querySelector(".top .meta");
      if (tip) tip.textContent = "وضع الضيف: يمكنكم البقاء على الصفحة للتصويت مع الجلسة.";
    }

    function isLocked() { return !isGuest && localStorage.getItem(LOCK_KEY) === "1"; }
    function setLocked(on) {
      if (isGuest) return; // الضيوف لا يُقفَلون
      if (on) localStorage.setItem(LOCK_KEY, "1");
      else localStorage.removeItem(LOCK_KEY);
      guard.classList.toggle("on", Boolean(on));
      if (on) {
        lockErr.textContent = "";
        lockPin.value = "";
      } else if (lastData) {
        screen = "";
        paint(lastData);
      }
    }

    document.getElementById("btn-fs").onclick = async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch { /* بعض الجوالات تمنع */ }
    };
    document.getElementById("btn-unlock").onclick = () => {
      if (String(lockPin.value).trim() === PIN) {
        setLocked(false);
      } else {
        lockErr.textContent = "كلمة السر غير صحيحة";
        lockPin.value = "";
        lockPin.focus();
      }
    };
    lockPin.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("btn-unlock").click();
    });

    function markLeftSoon() {
      if (isGuest) return;
      clearTimeout(leaveTimer);
      leaveTimer = setTimeout(() => {
        if (document.hidden) setLocked(true);
      }, 400); // أقل من ثانية
    }
    document.addEventListener("visibilitychange", () => {
      if (isGuest) return;
      if (document.hidden) markLeftSoon();
      else clearTimeout(leaveTimer);
    });

    if (isLocked()) setLocked(true);

    const _paint = paint;
    paint = function (incoming) {
      if (isLocked()) {
        guard.classList.add("on");
        if (incoming) lastData = incoming;
        return;
      }
      _paint(incoming);
    };

    boot();
  </script>
</body>
</html>
